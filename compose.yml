# start with `docker compose up` (from repo root)
name: fyrss
services:
  postgres:
    container_name: fyrss_postgres
    image: postgres:17@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      PGDATA: /data/postgres
    volumes:
      - db-fyrss:/data/postgres
      - ./server/db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
  # fyrss-server:
  #   container_name: fyrss_server
  #   image: fyrss-server:latest
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - postgres
  #   env_file:
  #     - server/.env.dev
  #     - server/.env.secrets
  #   environment:
  #     - DATABASE_URL=postgres://postgres:changeme@postgres:5432/fyrss?sslmode=disable

volumes:
  db-fyrss:
